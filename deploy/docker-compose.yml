# Runs on your Oracle Cloud Always-Free VM. Three containers:
#   api          - the FastAPI backend (AI chat + Tesla adapter)
#   caddy        - reverse proxy with automatic Let's Encrypt TLS for your domain
#   tesla-proxy  - Tesla's Go vehicle-command signing proxy (only needed for the
#                  fleet adapter; harmless to leave running while on mock)
#
# For a $0 setup, point a free DuckDNS subdomain (e.g. amp.duckdns.org) at the
# VM's public IP, then set DOMAIN below. Caddy gets a real cert automatically.

services:
  api:
    build: ../backend
    env_file: ../backend/.env
    expose:
      - "8000"
    restart: unless-stopped
    volumes:
      # For the fleet adapter, mount your generated keys:
      - ../backend/keys:/app/keys:ro
      # tesla_tokens.db lives here (see app/auth/oauth.py) — without this
      # mount it's in the container's writable layer and every redeploy
      # (which recreates the container) wipes it, forcing Tesla re-login.
      - ../backend/data:/app/data
      # The signing proxy's self-signed certificate, so the api can pin to it
      # instead of disabling TLS verification on the channel that carries the
      # Tesla bearer token (see fleet.py PROXY_CA).
      - ./certs/proxy-cert.pem:/certs/proxy-cert.pem:ro
    networks:
      - default
      - signing

  frontend:
    build:
      context: ../mobile
      dockerfile: ../deploy/Dockerfile.web
    expose:
      - "80"
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - frontend
    restart: unless-stopped

  # Tesla's official signing proxy. Uncomment when you switch to the fleet adapter.
  # Build from https://github.com/teslamotors/vehicle-command (tesla-http-proxy),
  # or use a prebuilt image. It signs commands with your enrolled virtual key.
  tesla-proxy:
    build:
      context: .
      dockerfile: Dockerfile.proxy
    # -host 0.0.0.0: the proxy defaults to binding "localhost", which only
    # accepts connections from inside its own container — the api container
    # (a separate network namespace) got a bare "connection refused" for
    # every signed command (lock, climate, seat heaters, media, charging).
    # The port is only `expose`d, never `ports`-published, so it stays
    # unreachable from the internet.
    #
    # It is still reachable by every sibling container, and it holds the
    # virtual key that signs vehicle commands — so it sits on its own network
    # shared solely with the api service (below). The static frontend and
    # Caddy have no business talking to it.
    #
    # -verbose dropped on purpose: this process terminates OAuth bearer tokens
    # and signed command payloads, and verbose logging put them in
    # `docker compose logs`.
    command: >
      -tls-key /certs/proxy-key.pem -cert /certs/proxy-cert.pem
      -key-file /keys/private-key.pem -host 0.0.0.0 -port 4443
    volumes:
      - ./keys:/keys:ro
      - ./certs:/certs:ro
    expose:
      - "4443"
    networks:
      - signing
    restart: unless-stopped

networks:
  # Default bridge keeps caddy <-> api <-> frontend talking; `signing` is
  # joined only by api and tesla-proxy, so nothing else on the compose network
  # can ask for a command to be signed with the vehicle key.
  default:
  signing:

volumes:
  caddy_data:
  caddy_config:
