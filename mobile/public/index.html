<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover: required for react-native-safe-area-context's web
         implementation to pick up real safe-area-inset-* values (notch, home
         indicator) — without it every inset reads as 0 even in standalone
         PWA mode. interactive-widget=resizes-content: makes the on-screen
         keyboard actually shrink the layout (like native) instead of just
         overlaying it and hiding the input bar underneath. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, shrink-to-fit=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>Amp</title>

    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- "Add to Home Screen" as a standalone app, not a Safari tab. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Amp" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- No theme-color here on purpose: Expo injects one from app.json's
         web.themeColor, and a second copy in this template only invites the
         two to drift apart. app.json is where that colour lives.

         It was not the cause of the white bars anyway — it was already being
         emitted while they were showing. The cause was the document having no
         background at all; see the reset below. -->

    <!-- This one Expo does not emit. It stops the browser assuming a light
         document, which is what colours form controls, scrollbars and the
         overscroll area. -->
    <meta name="color-scheme" content="dark" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }

      /* …except that on iOS, "100%" is not the screen.
       *
       * In a standalone PWA with viewport-fit=cover, the percentage resolves
       * against a layout viewport that stops short of the bottom of the
       * display. The app therefore ended a few dozen points above the edge and
       * the document showed through below it — that strip is what used to be
       * white, and after it was painted dark it became a gap under the input
       * bar instead. Same missing height, two different symptoms.
       *
       * `dvh` is the unit that means the viewport actually in front of you.
       * Declared second so a browser that does not know it keeps the rule
       * above rather than losing its height altogether. */
      html,
      body,
      #root {
        height: 100dvh;
      }

      /* The document's own colour, which nothing had set. This is the fix for
       * the white strips at the notch and along the bottom edge.
       *
       * With viewport-fit=cover the viewport reaches under the notch and the
       * home indicator, and the app's SafeAreaView deliberately pads its
       * content away from both — so whatever is behind that padding shows
       * through. That was the page, and the page was white. The insets were
       * being respected correctly, the theme colour was already declared;
       * there was simply nothing dark behind the padding.
       *
       * `color-scheme` belongs here too: it is what stops the browser painting
       * a white overscroll area above and below the app when a scroll runs
       * past its end. */
      html,
      body,
      #root {
        background-color: #0f1114;
        color-scheme: dark;
      }

      /* A pull past the end of a list must not drag the whole app with it —
       * in a standalone PWA that gesture is how the page itself detaches and
       * shows a white gap underneath.
       *
       * On `html` as well as `body`, and that is the half that matters for the
       * sideways axis: a horizontal overscroll is how Chrome decides you meant
       * "go back", which fired alongside the drawer opening. The declaration
       * propagates from body to the viewport only when html has not made its
       * own, so stating it once was not enough. The edge strip in
       * ChatScreen.tsx refuses the same gesture at the DOM, for the browsers
       * that do not read this. */
      html,
      body {
        overscroll-behavior: none;
      }
    </style>

    <!-- Remove the gray tap-highlight rectangle mobile browsers draw on any
         tap, and the default focus outline on text inputs — this app draws
         its own focus ring (see ChatInput.tsx), the browser default just
         doubles it. -->
    <style id="tap-highlight-reset">
      * {
        -webkit-tap-highlight-color: transparent;
        tap-highlight-color: transparent;
      }
      input,
      textarea,
      [contenteditable] {
        outline: none;
      }
    </style>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <div id="root"></div>
  </body>
</html>
